<script>
const w=document.getElementById('w'),top_=document.getElementById('top'),
      ti=document.getElementById('topimg'),bar=document.getElementById('bar'),
      knob=document.getElementById('knob');
function set(fr){fr=Math.max(0,Math.min(1,fr));const px=fr*w.clientWidth;
  top_.style.width=px+'px';ti.style.width=w.clientWidth+'px';
  bar.style.left=px+'px';knob.style.left=px+'px';}
function fromEvent(e){const r=w.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;set(x/r.width);}
let drag=false;
w.addEventListener('pointerdown',e=>{drag=true;fromEvent(e);});
window.addEventListener('pointermove',e=>{if(drag)fromEvent(e);});
window.addEventListener('pointerup',()=>drag=false);
window.addEventListener('resize',()=>set(0.5));
set(0.5);
</script></body></html>
